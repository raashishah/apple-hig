version: 1
entry: /notes
screens:
  - id: notes
    route: /notes
    title: Notes
    priority: 1
    status: designed
    kind: action
    to: detail
    list:
      status: ready
  - id: empty
    route: /notes/empty
    title: Empty
    priority: 2
    status: designed
    kind: static
    list:
      status: empty
  - id: detail
    route: /notes/detail
    title: Detail
    priority: 3
    status: designed
    kind: action
    to: notes
    create:
      kind: short
  - id: create
    route: /notes/new
    title: New note
    priority: 4
    status: designed
    kind: static
    create:
      kind: long
      route: /notes/new
  - id: fault
    route: /notes/fault
    title: Fault
    priority: 5
    status: designed
    kind: action
    to: notes
    list:
      status: fault
