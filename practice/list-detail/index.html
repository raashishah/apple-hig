<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>List</title>
  <link rel="stylesheet" href="../../skills/hig/tokens/web.css">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    h1 {
      margin: 0;
      padding: 8px 20px 12px;
      font-size: 34px;
      font-weight: 400;
      line-height: 41px;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    a, button, label {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 0 20px;
      color: inherit;
      text-decoration: none;
      font-size: 17px;
      font-weight: 400;
      line-height: 22px;
    }
    .footnote {
      margin: 0;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
    }
    input {
      display: block;
      width: 100%;
      margin: 0;
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: CanvasText;
      font: inherit;
      font-size: 17px;
      font-weight: 400;
    }
    button {
      width: 100%;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: LinkText;
      font: inherit;
    }
    #detail { display: none; }
    #detail:target { display: block; }
    #detail:target ~ #list { display: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <section id="detail">
    <h1>General</h1>
    <label for="name">Name</label>
    <input id="name" name="name" value="Example">
    <button type="button" data-primary="true">Save</button>
    <p class="footnote" data-body>Shown on this device.</p>
  </section>
  <section id="list">
    <h1>Items</h1>
    <ul>
      <li><a href="#detail">General</a></li>
      <li><a href="#detail">Display</a></li>
      <li><a href="#detail">Sound</a></li>
    </ul>
    <p class="footnote" data-body>Three examples.</p>
  </section>
</body>
</html>
