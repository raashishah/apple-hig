version: 1
# Parallel swarm surfaces for /hig. Each id maps to one agent + pack + Apple URL.
# Orchestrator fans these out after preflight. Agents apply HIG in the host stack
# (SwiftUI / UIKit / CSS / other) — they do not inject a React component kit.
# affordance (optional): host widget class for catalog-phase skip.
# Required patterns: list | form | overlay | chrome.
# Optional widgets: menu | picker | progress | search | notification |
# loading | feedback | onboarding | drag | settings | undo | slider |
# scroll | popover | collection | pagecontrol | label | textview | imageview | chart | disclosure | box | editmenu | help | webview | activityview | print | fullscreen | filebrowser | focus | account | tabview | multitask | reviewprompt | appwindow | videoplayer | haptic | airplay | gyro | quickaction | liveviewing | snippet | genai | alwayson | shareplay | nearby | activityring | nfc | ar | taptopay | idverifier | iap | map | homekit | workout | livephoto | icloud | siri | appshortcut | healthkit | carplay | siwa | applepay | audioplayer | gcaccess | panel | pathcontrol | outline | stickerpack | actionbutton | cameracontrol | dockmenu | gesture | keyboard.
# Foundations omit it and still apply. list includes collection/card grids.

surfaces:
  - id: layout
    pack: foundations-layout.md
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/layout
    covers: [alignment, safe-areas, split-columns, size-classes]
