# Mechanical Don't scanners for catalog apply.
# Match is normalized against pack Don't bullets. Not a topic-id list.
# Account a topic only when every Don't on it matches a scanner here.
heuristics:
  - id: hero-type-in-lists
    match: Marketing hero type inside dense inventory lists
  - id: all-caps-long-labels
    match: All-caps long labels
  - id: too-many-font-families
    match: Mixing 5+ unrelated font families
  - id: rainbow-nav-accents
    match: Rainbow accents across nav
  - id: muted-only-labels
    match: Low-contrast muted text as the only label style
  - id: glass-tints-on-chrome
    match: Glass tints replacing solid semantic fills on primary chrome
  - id: hard-black-white-chrome
    match: Hard-coded #000 / #fff chrome that ignores Dark Mode
  - id: color-only-error-or-selected
    match: Color-only error or selected states
  - id: bounce-on-appear
    match: Ornamental bounce on menus that merely appeared
  - id: locked-out-during-motion
    match: Locked-out UI during transitions
  - id: motion-without-reduce
    match: Parallax or large zooms when Reduce Motion is on
  - id: placeholder-only-label
    match: Placeholder-as-only-label
  - id: tiny-critical-type
    match: Tiny decorative type for critical data
  - id: color-only-error
    match: Color-only error states
  - id: hide-only-path-behind-search
    match: Hide the only path to content behind search
  - id: spinner-per-keystroke
    match: Block the UI with a spinner on every keystroke
  - id: search-as-settings-dump
    match: Use search as the settings or command dump
  - id: sarcastic-error-hides-fix
    match: Cute or sarcastic error copy that hides the fix
  - id: title-case-long-help
    match: Title Case On Every Long Sentence in body help
  - id: rewrite-system-alerts
    match: Rewriting system alerts
  - id: dark-pattern-allow-only
    match: Dark-pattern Allow as the only readable control
  - id: preemptive-permission-on-marketing
    match: Pre-emptive camera/mic/location prompts on a marketing screen
  - id: rewrite-or-automate-system-ui
    match: Rewriting or automating system permission
  - id: opaque-brand-bar-fills
    match: Painting opaque brand fills onto navigation
  - id: watermarks-on-content
    match: Watermarks on content
  - id: brand-outlined-sf-rewrite
    match: Rewriting SF Symbols into a custom outlined set
  - id: sf-symbol-name-tables
    match: Pixel tables of SF Symbol names
  - id: outlined-doodles-in-toolbar
    match: Custom outlined doodles next to system symbols
  - id: decorative-icon-duplicates-label
    match: Decorative icons that duplicate a visible text label
  - id: screenshot-empty-state
    match: Screenshot dumps as empty-state
  - id: bitmap-sf-symbols
    match: Lossy scaling of SF Symbols exported as bitmaps
  - id: copied-scale-factor-tables
    match: Copying Apple's scale-factor tables
  - id: icon-composer-templates-as-law
    match: Copying Icon Composer templates or variant recipes
  - id: busy-photo-app-icon
    match: Photos of people or busy gradients that collapse
  - id: app-icon-alpha-mask-tricks
    match: Alpha tricks that fight the system mask
  - id: tokenizing-diversity-stock
    match: Clownish diversity stock that tokenizes
  - id: ability-body-jokes-empty
    match: Ability or body jokes in empty states
  - id: locked-skin-tone-defaults
    match: Skin-tone or hair defaults that cannot be changed
  - id: settings-required-for-first-run
    match: Require Settings to complete first-run
  - id: nested-prefs-no-grouping
    match: Nest every preference under undiscoverable chevrons
  - id: retheme-system-settings
    match: Re-theme system Settings chrome
  - id: confirm-every-delete-with-undo
    match: Confirm every delete when Undo is one tap
  - id: silent-nav-data-loss
    match: Silent data loss on navigation with no undo
  - id: spinner-loop-no-way-out
    match: Loop an indeterminate spinner with no way out
  - id: fake-percent-progress
    match: Animate fake percent
  - id: loading-modal-hides-nav
    match: Hide the nav behind a loading modal
  - id: modal-success-after-save
    match: Modal "Success" alerts after a save
  - id: error-toast-disappears
    match: Error-only-as-toast that disappears
  - id: confetti-on-crud
    match: Celebratory confetti on ordinary CRUD
  - id: account-wall-before-value
    match: Require an account before any value
  - id: every-permission-on-page-one
    match: Ask for every permission on page one
  - id: help-as-six-interstitials
    match: Duplicate Help as six interstitial cards
  - id: first-launch-notification-wall
    match: First-launch "Enable notifications" wall
  - id: marketing-as-time-sensitive
    match: Marketing as time-sensitive
  - id: custom-lock-screen-ui
    match: Custom lock-screen UI that fights the system
  - id: hidden-drag-no-alternative
    match: Hidden drag with no alternative
  - id: drop-navigates-without-preview
    match: Drop that navigates away without a preview
  - id: fight-split-view-drops
    match: Fighting system multi-window / split-view drops
  - id: animated-splash-after-launch
    match: Animated splash after the system launch screen
  - id: video-sound-on-launch
    match: Video / sound on launch
  - id: launch-compatibility-brand-bars
    match: UIDesignRequiresCompatibility or custom opaque
