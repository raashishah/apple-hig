  - id: sz-mic
    match: microphone that stays on after the recognition sample
  - id: px-cancel
    match: discards edits without a confirm
  - id: px-toolbar
    match: custom top toolbar in a photo-editing session
  - id: ac-modified
    match: homemade or modified App Clip Code
  - id: ac-overlay
    match: text, logos, or images over an App Clip Code
  - id: ac-motion
    match: animated or dimmed App Clip Code
  - id: ac-rotate
    match: rotated App Clip Code
  - id: ac-aspect
    match: generated App Clip Code with a changed aspect ratio
  - id: ac-symbol
    match: symbol added to an App Clip Code
  - id: ac-solo
    match: App Clip logo used on its own
  - id: ac-fetch
    match: download of additional data with an App Clip Code
  - id: ac-splash
    match: splash screen that makes people wait on launch
  - id: ac-small
    match: App Clip Code that is too small
  - id: ac-gap
    match: App Clip Code without clear space
  - id: ac-shot
    match: screenshot of the app interface on an App Clip Code
  - id: ac-ads
    match: advertisement in an app clip
  - id: ac-promo
    match: purely promotional notification
  - id: ac-again
    match: log in again
