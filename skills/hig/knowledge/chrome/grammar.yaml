version: 1
# Solved Apple chrome grammar for web product UIs.
# Packs cite rule ids only. Criteria live here.
# Apple URLs only — never patient app paths or brand tokens.
rules:
  - id: chrome.view-mode.icons
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/segmented-controls
    failWhen: "View-mode control shows visible text labels (e.g. List/Grid) as the primary glyph."
    passWhen: "View-mode is an icon-only segmented control; accessible name via aria-label only."

  - id: chrome.list-browser.toolbar-budget
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/toolbars
    failWhen: "List/browser pane stacks more than one dedicated option/chrome band above rows so browsing content is secondary."
    passWhen: "List pane uses one compact toolbar band; content rows dominate the column."

  - id: chrome.list-browser.filter-density
    severity: P1
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/toggles
    failWhen: "List toolbar uses a full-phrase checkbox/label for a simple filter instead of a compact control."
    passWhen: "Simple list filters are compact toggles, menu items, or chips; full phrase in aria-label."

  - id: chrome.form.column-cohesion
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-forms, foundations-layout]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/layout
    failWhen: "Form title/actions column width does not match the field column (full-bleed header over capped fields)."
    passWhen: "Form title, primary actions, and fields share one content column width."

  - id: chrome.sidebar.collapsible
    severity: P1
    mutationClass: structure
    registers: [product]
    packs: [patterns-navigation, foundations-layout]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/sidebars
    failWhen: "Product md+ sidebar is fixed expanded width with no collapse/expand affordance."
    passWhen: "Product md+ sidebar supports collapse/expand so the work surface can reclaim width."

  - id: chrome.bars.system-materials
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [foundations-materials, patterns-navigation]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/materials
    failWhen: "Nav, toolbar, tab bar, or split-view chrome uses a custom opaque fill or tint that fights system materials / Liquid Glass."
    passWhen: "Chrome uses standard system bars, sheets, and controls; glass is the functional layer and content is the content layer; no custom opaque bar backgrounds. Reduce Transparency and Increase Contrast are respected."

  - id: chrome.materials.fashion-glass
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [foundations-materials, patterns-sheets]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/materials
    failWhen: "Glass or blur is painted on nav, tab bars, or content cards as decoration instead of a functional overlay (sheet, alert, picker)."
    passWhen: "Blur/glass is only on overlays with a solid fallback; nav and content stay system/solid."

  - id: chrome.layout.card-grid-home
    severity: P0
    mutationClass: structure
    registers: [product]
    packs: [foundations-layout, patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/layout
    failWhen: "Product home/root is a dashboard of marketing cards rather than a list, split, or tab workspace."
    passWhen: "Product home is a workspace (list/browser, split view, or tabs). Cards are not the root IA."

  - id: chrome.ive.nested-cards
    severity: P1
    mutationClass: structure
    registers: [product, any]
    packs: [foundations-spacing, patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/layout
    failWhen: "List or form is wrapped in extra card panels (boxes-in-boxes) instead of system grouped content."
    passWhen: "Lists and forms use grouped system content and hairline separators, not nested cards."

  - id: chrome.split.empty-select
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/split-views
    failWhen: "Empty list still renders an idle Select detail pane."
    passWhen: "Empty list omits the idle Select detail; the list owns the empty state."

  - id: chrome.split.list-width
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-lists-detail, foundations-layout]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/split-views
    failWhen: "List rail is starved thin beside an empty detail pane."
    passWhen: "List rail keeps its column when detail is empty."

  - id: chrome.create.short-vs-long
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-forms, patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/entering-data
    failWhen: "Long create stays an orphan half-width form in the split, or short create leaves the detail."
    passWhen: "Long create is a full page; short create stays in the detail."

  - id: chrome.list-status.lifecycle
    severity: P0
    mutationClass: structure
    registers: [product, any]
    packs: [patterns-lists-detail]
    appleUrl: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
    failWhen: "Loading or fault list status still offers Add or a dead detail."
    passWhen: "Loading and fault list status offer neither Add nor a dead detail."
